name: Workflows and collaboration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

# Merge-group runs key on the queue's unique head SHA in their own
# `merge_group`-scoped group, so a PR or push run can never cancel or
# supersede one. PR/push behavior is unchanged (no cancellation there
# either).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      # Default ref is github.sha, which for a merge_group event is the
      # merge-group head commit -- the combined queue tree, not the PR head.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned package manager
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated workflow adapters
        run: node scripts/generate-workflow-adapters.mjs --check
      - name: Test installed workflows and collaboration
        run: pnpm test
